name: Publicar APK validado
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir APK e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd test-build && sha256sum --check orbit-player.apk.sha256)
          if [[ "$RELEASE_TAG" == *-test* ]]; then
            RELEASE_ARGS=(--prerelease)
          else
            RELEASE_ARGS=(--latest)
          fi
          gh release create "$RELEASE_TAG" test-build/orbit-player.apk test-build/update.json --verify-tag "${RELEASE_ARGS[@]}" --title "Orbit Player $RELEASE_TAG" --notes-file test-build/RELEASE-NOTES.md
