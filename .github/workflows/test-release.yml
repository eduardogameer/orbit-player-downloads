name: Publicar APK validado
# One fixed release ("orbit-player") is updated in place for every version:
# the APK and update.json are replaced and the title/notes follow the new version.
# Publishing a version is just pushing a new test-build/ to this branch; no tags.
on:
  push:
    branches: ['codex/tv-box-standalone-023']
    paths: ['test-build/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbit-player-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir APK e atualizar a release fixa
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: orbit-player
        run: |
          set -euo pipefail
          (cd test-build && sha256sum --check orbit-player.apk.sha256)
          version=$(jq -r .versionName test-build/update.json)
          # update.json must describe exactly this APK at the fixed download address.
          [ "$(jq -r .sha256 test-build/update.json)" = "$(sha256sum test-build/orbit-player.apk | cut -d' ' -f1)" ]
          [ "$(jq -r .size test-build/update.json)" = "$(stat -c %s test-build/orbit-player.apk)" ]
          [ "$(jq -r .url test-build/update.json)" = "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/orbit-player.apk" ]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" test-build/orbit-player.apk test-build/update.json --clobber
            gh release edit "$RELEASE_TAG" --title "Orbit Player $version" --notes-file test-build/RELEASE-NOTES.md --latest
          else
            gh release create "$RELEASE_TAG" test-build/orbit-player.apk test-build/update.json --target "$GITHUB_SHA" --latest --title "Orbit Player $version" --notes-file test-build/RELEASE-NOTES.md
          fi
